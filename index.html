<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบแผนที่ขยะอันตรายในเขต อบต.เมืองเก่า</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- SheetJS สำหรับ Export/Import Excel และสร้าง Template -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        
        #login-container {
            display: flex; justify-content: center; align-items: center; height: 100vh; background: #e9ecef;
        }
        .login-box {
            background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center;
        }
        .login-box img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid #ddd; }
        .login-box h2 { font-size: 18px; margin-top: 0; color: #333; margin-bottom: 20px; }
        
        #app-container {
            display: none; height: 100vh; display: flex;
        }
        #sidebar { width: 420px; padding: 20px; box-sizing: border-box; background: #f8f9fa; overflow-y: auto; border-right: 1px solid #ddd; }
        #map { flex-grow: 1; height: 100%; }
        
        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 7px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; height: 60px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 15px; margin-top: 8px; }
        button:hover { background: #0056b3; }
        
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:hover { background: #e0a800; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #138496; }
        
        .tools-section { background: #e2e6ea; padding: 10px; border-radius: 6px; margin-top: 20px; }
        .search-box { background: #e9ecef; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .location-item { background: white; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ddd; cursor: pointer; font-size: 13px; }
        .location-item:hover { background: #f1f3f5; }
    </style>
</head>
<body>

    <!-- หน้าจอเข้าสู่ระบบ -->
    <div id="login-container">
        <div class="login-box">
            <img src="https://pdoojfiwedjbrjvjtqth.supabase.co/storage/v1/object/public/logo/logo.jpg" alt="Logo อบต.เมืองเก่า" onerror="this.src='https://via.placeholder.com/80'">
            <h2>เข้าสู่ระบบแผนที่ขยะอันตรายในเขต อบต.เมืองเก่า</h2>
            <form id="loginForm" style="text-align: left;">
                <div class="form-group">
                    <label>อีเมล (Email):</label>
                    <input type="email" id="login_email" required placeholder="admin@mueangkao.go.th">
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน (Password):</label>
                    <input type="password" id="login_pass" required placeholder="กรอกรหัสผ่าน">
                </div>
                <button type="submit">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- หน้าจอแอปพลิเคชันหลัก -->
    <div id="app-container" style="display: none;">
        <div id="sidebar">
            <!-- ส่วนค้นหาชื่อสถานที่/กิจการ -->
            <div class="search-box">
                <label style="font-size: 13px;">🔍 ค้นหาชื่อกิจการ / จุดรวมชุมชน:</label>
                <input type="text" id="searchInput" placeholder="พิมพ์ชื่อเพื่อค้นหา..." oninput="filterLocations()">
                <div id="searchResults" style="max-height: 150px; overflow-y: auto; margin-top: 5px;"></div>
            </div>

            <h2 id="form-title">บันทึกข้อมูลแหล่งกำเนิด / จุดรวม</h2>
            <form id="locationForm">
                <input type="hidden" id="edit_id">
                <div class="form-group">
                    <label>1. ประเภทสถานที่:</label>
                    <select id="location_type">
                        <option value="สถานประกอบการ/กิจการ">สถานประกอบการ / กิจการ</option>
                        <option value="จุดรวมของชุมชน">จุดรวมของชุมชน (จุดทิ้ง/ศาลาประชาคม)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>2. ชื่อกิจการ / ชื่อจุดรวมชุมชน:</label>
                    <input type="text" id="name" required placeholder="ระบุชื่อสถานที่">
                </div>
                <div class="form-group">
                    <label>3. พิกัด (Lat, Lng):</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="lat" readonly required placeholder="Lat">
                        <input type="text" id="lng" readonly required placeholder="Lng">
                    </div>
                    <small style="color: #666;">*คลิกเลือกตำแหน่งบนแผนที่</small>
                </div>
                <div class="form-group">
                    <label>4. รายละเอียดเพิ่มเติม:</label>
                    <textarea id="description" placeholder="ลักษณะกิจการ / ประเภทขยะอันตราย / จุดรวบรวม"></textarea>
                </div>
                <div class="form-group">
                    <label>5. สถานะการขออนุญาต (เฉพาะกิจการ):</label>
                    <select id="license_status" required>
                        <option value="ขอแล้ว">ขอแล้ว</option>
                        <option value="ยังไม่ขอ">ยังไม่ขอ</option>
                        <option value="ไม่ระบุ/ไม่ใช่กิจการ">ไม่ระบุ / ไม่ใช่กิจการ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>6. วันหมดอายุใบอนุญาต:</label>
                    <input type="date" id="license_expire_date">
                </div>
                <div class="form-group">
                    <label>7. วิธีการกำจัดขยะอันตราย:</label>
                    <select id="disposal_method" required>
                        <option value="มีผู้มารับ">มีผู้มารับ (เอกชน/อบต.)</option>
                        <option value="นำส่งเอง">นำส่งเอง</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <button type="submit" id="btnSave" class="btn-success">บันทึกข้อมูล</button>
                <button type="button" id="btnCancelEdit" class="btn-danger" style="display:none;" onclick="resetForm()">ยกเลิกการแก้ไข</button>
            </form>

            <!-- เครื่องมือจัดการข้อมูลเพิ่มเติม -->
            <div class="tools-section">
                <h3>จัดการข้อมูลและนำเข้า/ส่งออก</h3>
                <button class="btn-info" onclick="downloadTemplate()">📊 ดาวน์โหลดเทมเพลต Excel</button>
                <button class="btn-warning" onclick="exportToExcel()">📥 ส่งออกข้อมูลทั้งหมดเป็น Excel</button>
                <button class="btn-success" onclick="backupData()">💾 สำรองข้อมูล (Backup JSON)</button>
                <div style="margin-top: 10px;">
                    <label style="font-size: 13px;">📤 นำเข้าข้อมูลจาก Excel:</label>
                    <input type="file" id="importFile" accept=".xlsx, .xls, .csv" onchange="importFromExcel(event)" style="font-size: 12px; background: white;">
                </div>
            </div>

            <button class="btn-danger" id="btnLogout" style="margin-top: 25px;">ออกจากระบบ</button>
        </div>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pdoojfiwedjbrjvjtqth.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__0KAOXCyM13SpC6S9DpfOw_ZKHUF4jd';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            db: { schema: 'hazardous_waste' }
        });

        let map, tempMarker = null;
        let allLocations = [];
        let markersLayer = L.layerGroup();

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isLoggedIn_hw') === 'true') {
                showApp();
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('login_email').value.trim();
            const passInput = document.getElementById('login_pass').value.trim();

            const { data, error } = await db
                .from('app_users')
                .select('*')
                .eq('email', emailInput)
                .eq('password', passInput);

            if (error || !data || data.length === 0) {
                alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง!');
            } else {
                localStorage.setItem('isLoggedIn_hw', 'true');
                showApp();
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('isLoggedIn_hw');
            location.reload();
        });

        function showApp() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            initMap();
        }

        function initMap() {
            if (map) return;
            map = L.map('map').setView([13.99, 101.73], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            markersLayer.addTo(map);

            map.on('click', function(e) {
                if (document.getElementById('edit_id').value) return;
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                document.getElementById('lat').value = lat;
                document.getElementById('lng').value = lng;

                if (tempMarker) map.removeLayer(tempMarker);
                tempMarker = L.marker([lat, lng]).addTo(map).bindPopup('จุดที่เลือก').openPopup();
            });

            loadLocations();
        }

        async function loadLocations() {
            const { data, error } = await db.from('locations').select('*');
            if (error) {
                console.error(error);
                return;
            }
            allLocations = data || [];
            renderMarkers(allLocations);
        }

        function renderMarkers(locations) {
            markersLayer.clearLayers();
            locations.forEach(loc => {
                if (loc.lat && loc.lng) {
                    const typeLabel = loc.location_type || 'สถานประกอบการ/กิจการ';
                    const popupContent = `
                        <b>${loc.name}</b><br>
                        <b>ประเภท:</b> ${typeLabel}<br>
                        <b>สถานะใบอนุญาต:</b> ${loc.license_status || '-'}<br>
                        <b>หมดอายุ:</b> ${loc.license_expire_date || '-'}<br>
                        <b>การกำจัด:</b> ${loc.disposal_method || '-'}<br>
                        <b>รายละเอียด:</b> ${loc.description || '-'}<br><br>
                        <button onclick="editLocation(${loc.id})" style="padding:2px 8px; background:#ffc107; border:none; border-radius:3px; cursor:pointer;">แก้ไข</button>
                        <button onclick="deleteLocation(${loc.id})" style="padding:2px 8px; background:#dc3545; color:white; border:none; border-radius:3px; cursor:pointer;">ลบ</button>
                    `;
                    const marker = L.marker([loc.lat, loc.lng]).bindPopup(popupContent);
                    markersLayer.addLayer(marker);
                    loc.markerRef = marker;
                }
            });
        }

        function filterLocations() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (!keyword) {
                renderMarkers(allLocations);
                return;
            }

            const filtered = allLocations.filter(loc => loc.name.toLowerCase().includes(keyword));
            renderMarkers(filtered);

            if (filtered.length === 0) {
                resultsContainer.innerHTML = '<div style="padding: 5px; color: #666; font-size: 12px;">ไม่พบชื่อที่ค้นหา</div>';
                return;
            }

            filtered.forEach(loc => {
                const div = document.createElement('div');
                div.className = 'location-item';
                div.innerHTML = `<b>${loc.name}</b><br><small>ประเภท: ${loc.location_type || 'กิจการ'}</small>`;
                div.onclick = () => {
                    map.setView([loc.lat, loc.lng], 16);
                    if (loc.markerRef) {
                        loc.markerRef.openPopup();
                    }
                };
                resultsContainer.appendChild(div);
            });
        }

        document.getElementById('locationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const editId = document.getElementById('edit_id').value;
            const formData = {
                location_type: document.getElementById('location_type').value,
                name: document.getElementById('name').value,
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value),
                description: document.getElementById('description').value,
                license_status: document.getElementById('license_status').value,
                license_expire_date: document.getElementById('license_expire_date').value || null,
                disposal_method: document.getElementById('disposal_method').value
            };

            if (editId) {
                const { error } = await db.from('locations').update(formData).eq('id', editId);
                if (error) alert('แก้ไขไม่สำเร็จ: ' + error.message);
                else { alert('แก้ไขข้อมูลสำเร็จ!'); location.reload(); }
            } else {
                const { error } = await db.from('locations').insert([formData]);
                if (error) alert('บันทึกไม่สำเร็จ: ' + error.message);
                else { alert('บันทึกข้อมูลสำเร็จ!'); location.reload(); }
            }
        });

        window.editLocation = function(id) {
            const loc = allLocations.find(item => item.id === id);
            if (!loc) return;

            document.getElementById('edit_id').value = loc.id;
            document.getElementById('location_type').value = loc.location_type || 'สถานประกอบการ/กิจการ';
            document.getElementById('name').value = loc.name;
            document.getElementById('lat').value = loc.lat;
            document.getElementById('lng').value = loc.lng;
            document.getElementById('description').value = loc.description || '';
            document.getElementById('license_status').value = loc.license_status || 'ขอแล้ว';
            document.getElementById('license_expire_date').value = loc.license_expire_date || '';
            document.getElementById('disposal_method').value = loc.disposal_method || 'มีผู้มารับ';

            document.getElementById('form-title').innerText = 'แก้ไขข้อมูลสถานที่';
            document.getElementById('btnSave').innerText = 'บันทึกการแก้ไข';
            document.getElementById('btnCancelEdit').style.display = 'block';
            document.getElementById('sidebar').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('locationForm').reset();
            document.getElementById('edit_id').value = '';
            document.getElementById('form-title').innerText = 'บันทึกข้อมูลแหล่งกำเนิด / จุดรวม';
            document.getElementById('btnSave').innerText = 'บันทึกข้อมูล';
            document.getElementById('btnCancelEdit').style.display = 'none';
        }

        window.deleteLocation = async function(id) {
            if (confirm('คุณต้องการลบข้อมูลนี้ใช่หรือไม่?')) {
                const { error } = await db.from('locations').delete().eq('id', id);
                if (error) alert('ลบไม่สำเร็จ: ' + error.message);
                else { alert('ลบข้อมูลเรียบร้อยแล้ว'); location.reload(); }
            }
        }

        // ฟังก์ชันดาวน์โหลด Template Excel (รองรับ location_type)
        function downloadTemplate() {
            const templateData = [
                {
                    location_type: "สถานประกอบการ/กิจการ",
                    name: "ตัวอย่าง ร้านค้า ก",
                    lat: 13.99000,
                    lng: 101.73000,
                    description: "จำหน่ายแบตเตอรี่และสารเคมี",
                    license_status: "ขอแล้ว",
                    license_expire_date: "2027-12-31",
                    disposal_method: "มีผู้มารับ"
                },
                {
                    location_type: "จุดรวมของชุมชน",
                    name: "ตัวอย่าง จุดทิ้งขยะอันตรายหมู่ 1",
                    lat: 13.99200,
                    lng: 101.73200,
                    description: "ศาลาประชาคมหมู่บ้าน จุดรวบรวมถ่านไฟฉายและหลอดไฟ",
                    license_status: "ไม่ระบุ/ไม่ใช่กิจการ",
                    license_expire_date: "",
                    disposal_method: "อบต.มารับ"
                }
            ];
            const worksheet = XLSX.utils.json_to_sheet(templateData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Template");
            XLSX.writeFile(workbook, "hazardous_waste_template.xlsx");
        }

        function exportToExcel() {
            if (allLocations.length === 0) { alert('ไม่มีข้อมูลสำหรับส่งออก'); return; }
            const worksheet = XLSX.utils.json_to_sheet(allLocations);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Hazardous Waste Locations");
            XLSX.writeFile(workbook, "hazardous_waste_locations.xlsx");
        }

        function backupData() {
            if (allLocations.length === 0) { alert('ไม่มีข้อมูลสำหรับสำรอง'); return; }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allLocations, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "hazardous_waste_backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        async function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(sheet);

                    if (rows.length === 0) { alert('ไม่พบข้อมูลในไฟล์ Excel'); return; }

                    const cleanRows = rows.map(r => ({
                        location_type: r.location_type || r.ประเภทสถานที่ || 'สถานประกอบการ/กิจการ',
                        name: r.name || r.ชื่อกิจการ,
                        lat: parseFloat(r.lat || r.ละติจูด),
                        lng: parseFloat(r.lng || r.ลองจิจูด),
                        description: r.description || r.รายละเอียดเพิ่มเติม || '',
                        license_status: r.license_status || r.สถานะการขออนุญาต || 'ขอแล้ว',
                        license_expire_date: r.license_expire_date || r.วันหมดอายุใบอนุญาต || null,
                        disposal_method: r.disposal_method || r.วิธีการกำจัดขยะอันตราย || 'มีผู้มารับ'
                    }));

                    const { error } = await db.from('locations').insert(cleanRows);
                    if (error) {
                        alert('นำเข้าข้อมูลไม่สำเร็จ: ' + error.message);
                    } else {
                        alert('นำเข้าข้อมูลจาก Excel สำเร็จ!');
                        location.reload();
                    }
                } catch (err) {
                    alert('เกิดข้อผิดพลาดในการอ่านไฟล์: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
